<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Rooftop interlude</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="rooftop.css">
  <script type="module" src="rooftop.js"></script>
</head>
<body>
  <main>
    <section aria-label="Interactive sunset rooftop" class="rooftop">
      <div class="stage" id="stage" aria-busy="false">
        <img class="base-poster" src="assets/idle-ground.png" width="860" height="380" alt="The cat on the nearest rooftop; Okarun and Momo on a building across the gap.">
        <video class="base-video" id="ambient" muted playsinline loop preload="none" aria-hidden="true"></video>
        <img class="actor-layer" id="resting-actors" src="assets/rest-ground.png" width="362" height="380" alt="" aria-hidden="true">
        <video class="actor-layer performance" id="performance" muted playsinline preload="none" aria-hidden="true"></video>
        <img class="actor-layer reduced-pose" id="reduced-pose" alt="" aria-hidden="true" hidden>
        <button class="hotspot okarun" data-action="okarun" disabled aria-label="Tap Okarun: transform into Turbo mode and visit the cat">
          <span class="hotspot-label">Okarun</span>
        </button>
        <button class="hotspot momo" data-action="momo" disabled aria-label="Tap Momo: climb with her psychic hands">
          <span class="hotspot-label">Momo</span>
        </button>
        <a class="hotspot cat" href="https://prithvi8706.github.io/Prithvi8706/" aria-label="Tap the cat to enter the original playground">
          <span class="hotspot-label">Enter playground</span>
        </a>
      </div>
      <nav class="scene-controls" aria-label="Rooftop actions">
        <button data-action="okarun" disabled>Turbo Okarun</button>
        <button data-action="momo" disabled>Momo's climb</button>
        <a href="https://prithvi8706.github.io/Prithvi8706/">Playground <span aria-hidden="true">↗</span></a>
        <button id="motion" aria-pressed="false">Pause motion</button>
        <button id="reset" hidden>Reset rooftop</button>
      </nav>
      <p class="status" id="status" role="status" aria-live="polite">Tap Okarun or Momo. The cat opens the playground.</p>
      <noscript><p class="status">Character performances need JavaScript. You can still open the playground using the cat.</p></noscript>
    </section>
    <picture><source media="(prefers-reduced-motion: reduce)" srcset="assets/readme-aura-hero-static-fdfa9beea556.svg" /><img src="assets/readme-aura-hero-ba40b35b5333.svg" width="860" alt="Prithvi Raghu. Quantum computing, Scientific modeling, Verified AI &amp; APIs, Systems engineering" /></picture>
<picture><source media="(prefers-reduced-motion: reduce)" srcset="assets/readme-aura-stats-static-21508f2cee76.svg" /><img src="assets/readme-aura-stats-c235f03da4f0.svg" width="860" alt="14 public repos; 4 stars; 829 commits in public default-branch history." /></picture>
<picture><source media="(prefers-reduced-motion: reduce)" srcset="assets/readme-aura-skills-static-5359f4897b62.svg" /><img src="assets/readme-aura-skills-3aa2421e9caf.svg" width="860" alt="Built with: Quantum computing: Qiskit, PennyLane, QUBO; ML &amp; experiments: QCNNs, Contextual bandits, Benchmarking; Scientific modeling: HF geolocation, Python, NumPy, SciPy; Verified AI &amp; APIs: Proof checks, FastAPI, Pydantic; Systems engineering: Flex / Bison, Memory allocation, Network simulation; Web &amp; 3D: TypeScript, React, Next.js, Three.js" /></picture>
    <footer>Made in Blender</footer>
  </main>
</body>
</html>
